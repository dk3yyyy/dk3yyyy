<svg xmlns="http://www.w3.org/2000/svg" width="390" height="440" viewBox="0 0 390 440" role="img" aria-labelledby="title desc">
  <title id="title">Joshua Nwachinemere, AI Engineer, mobile VOLYX OS terminal profile</title>
  <desc id="desc">A responsive phosphor-green terminal interface with animated glitch text, system logs, and an open-to-work status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c10"/><stop offset="1" stop-color="#050908"/></linearGradient>
    <radialGradient id="vig"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".65"/></radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#fff" opacity=".018"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}.g{fill:#00ff88}.c{fill:#00cfff}.w{fill:#d8dee9}.m{fill:#75838e}.dim{fill:#456157}.tiny{font-size:9px}.small{font-size:10px}.body{font-size:11px}.label{font-size:10px;font-weight:700;letter-spacing:.6px}.pulse{animation:pulse 1.8s ease-in-out infinite}.scan{animation:scan 8s linear infinite}.cyan{animation:g1 3.7s steps(1,end) infinite}.red{animation:g2 3.7s steps(1,end) infinite}.b1{animation:log 6s ease-in-out infinite}.b2{animation:log 6s .7s ease-in-out infinite}@keyframes pulse{50%{opacity:.28}}@keyframes scan{to{transform:translateY(8px)}}@keyframes g1{0%,94%,100%{transform:translateX(0);opacity:.25}95%{transform:translateX(3px);opacity:.8}96%{transform:translateX(-2px);opacity:.15}}@keyframes g2{0%,92%,100%{transform:translateX(0);opacity:.2}93%{transform:translateX(-3px);opacity:.75}94%{transform:translateX(2px);opacity:.1}}@keyframes log{0%,15%{opacity:.18}25%,82%{opacity:1}92%,100%{opacity:.18}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.cyan,.red{opacity:.12}}
    </style>
  </defs>
  <rect width="390" height="440" rx="11" fill="url(#bg)"/><rect x="1" y="1" width="388" height="438" rx="10" fill="none" stroke="#00ff88" stroke-opacity=".16"/>
  <circle cx="16" cy="17" r="3" fill="#ff5f56"/><circle cx="26" cy="17" r="3" fill="#ffbd2e"/><circle cx="36" cy="17" r="3" fill="#27c93f"/><text x="48" y="20" class="g tiny">VOLYX_OS</text><text x="372" y="20" text-anchor="end" class="dim tiny">TTY_01</text><line x1="12" y1="31" x2="378" y2="31" stroke="#00ff88" stroke-opacity=".12"/>
  <text x="18" y="53" class="dim tiny">// PROFILE.README</text>
  <text x="18" y="108" fill="#ff294d" opacity=".2" font-size="44" font-weight="800" class="red">JOSHUA</text><text x="18" y="108" class="c cyan" opacity=".25" font-size="44" font-weight="800">JOSHUA</text><text x="18" y="108" class="g" filter="url(#glow)" font-size="44" font-weight="800">JOSHUA</text>
  <text x="18" y="138" class="w" font-size="25" font-weight="700">NWACHINEMERE</text>
  <text x="18" y="160" class="c small">AI Engineer</text><text x="91" y="160" class="dim small">|</text><text x="101" y="160" class="g small">Python</text><text x="148" y="160" class="dim small">|</text><text x="158" y="160" class="w small">Building VolyxAI</text>
  <circle cx="21" cy="179" r="4" class="g pulse"/><text x="32" y="182" class="g small">open to AI / ML engineering roles</text>

  <rect x="14" y="200" width="362" height="119" rx="3" fill="#06100d" stroke="#00ff88" stroke-opacity=".14"/><text x="26" y="219" class="g label">❯ cat about.txt</text><line x1="26" y1="228" x2="364" y2="228" stroke="#00ff88" stroke-opacity=".1"/><text x="26" y="248" class="w body">I build the retrieval, routing, evaluation,</text><text x="26" y="265" class="w body">multimodal input, and reliability layers</text><text x="26" y="282" class="w body">that turn model capability into useful systems.</text><text x="26" y="305" class="g tiny">FOCUS → RAG · multimodal AI · evals · async systems</text>

  <rect x="14" y="330" width="362" height="84" rx="3" fill="#050a09" stroke="#00cfff" stroke-opacity=".14"/><text x="26" y="350" class="c label">volyx@os:~$ boot --profile</text><text x="348" y="350" text-anchor="end" class="dim tiny">PID 6720</text><text x="26" y="375" class="b1"><tspan class="g body">[ OK ]</tspan><tspan class="m body"> model_router.py</tspan></text><text x="26" y="398" class="b2"><tspan class="g body">[ OK ]</tspan><tspan class="m body"> human_control.gate</tspan></text>
  <line x1="14" y1="418" x2="376" y2="418" stroke="#00ff88" stroke-opacity=".14"/><text x="18" y="431" class="dim tiny">// intent over noise.</text><text x="371" y="431" text-anchor="end" class="g tiny">λ READY</text>
  <rect width="390" height="440" fill="url(#vig)" pointer-events="none"/><rect width="390" height="440" fill="url(#scan)" class="scan" pointer-events="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Joshua Nwachinemere, AI Engineer, VOLYX OS terminal profile</title>
  <desc id="desc">An animated CRT terminal profile for Joshua Nwachinemere with boot logs, glitch typography, AI engineering focus, and open-to-work status.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00ff88" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#00cfff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="55%" stop-color="#080c10" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".17"/>
    </pattern>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nameClip"><rect x="50" y="128" width="650" height="164" rx="2"/></clipPath>
  </defs>
  <style>
    .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .scan{animation:scan 9s linear infinite}
    .flicker{animation:flicker 8s infinite}
    .cursor{animation:blink 1s steps(1,end) infinite}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center}
    .ghost-cyan{animation:ghostC 3.6s steps(1,end) infinite}
    .ghost-red{animation:ghostR 3.6s steps(1,end) infinite .12s}
    .boot1{animation:boot 8s infinite 0s}.boot2{animation:boot 8s infinite .35s}.boot3{animation:boot 8s infinite .7s}.boot4{animation:boot 8s infinite 1.05s}.boot5{animation:boot 8s infinite 1.4s}.boot6{animation:boot 8s infinite 1.75s}
    .route{stroke-dasharray:8 10;animation:route 8s linear infinite}
    @keyframes scan{to{transform:translateY(24px)}}
    @keyframes blink{0%,46%{opacity:1}47%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.78)}50%{opacity:1;transform:scale(1.2)}}
    @keyframes flicker{0%,96%,100%{opacity:1}97%{opacity:.82}98%{opacity:.97}99%{opacity:.88}}
    @keyframes ghostC{0%,89%,100%{transform:translate(0);opacity:0}90%{transform:translate(5px,-1px);opacity:.75}92%{transform:translate(-2px,1px);opacity:.45}94%{opacity:0}}
    @keyframes ghostR{0%,89%,100%{transform:translate(0);opacity:0}90%{transform:translate(-5px,1px);opacity:.72}92%{transform:translate(3px,-1px);opacity:.4}94%{opacity:0}}
    @keyframes boot{0%,7%{opacity:0;transform:translateY(3px)}10%,88%{opacity:1;transform:translateY(0)}94%,100%{opacity:.22}}
    @keyframes route{to{stroke-dashoffset:-180}}
    @media(prefers-reduced-motion:reduce){.scan,.flicker,.cursor,.pulse,.ghost-cyan,.ghost-red,.boot1,.boot2,.boot3,.boot4,.boot5,.boot6,.route{animation:none!important}.ghost-cyan,.ghost-red{display:none}}
  </style>

  <rect width="1200" height="620" rx="22" fill="#080c10"/>
  <rect x="1" y="1" width="1198" height="618" rx="21" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g class="flicker">
    <rect x="22" y="20" width="1156" height="580" rx="12" fill="#080c10" stroke="#00ff88" stroke-opacity=".14"/>

    <g class="mono" font-size="15">
      <circle cx="51" cy="48" r="6" fill="#f85149" fill-opacity=".75"/>
      <circle cx="72" cy="48" r="6" fill="#d29922" fill-opacity=".75"/>
      <circle cx="93" cy="48" r="6" fill="#3fb950" fill-opacity=".75"/>
      <text x="122" y="54" fill="#00ff88" font-size="14" letter-spacing="1.5">VOLYX_OS</text>
      <text x="226" y="54" fill="#00ff88" fill-opacity=".32">~/dk3yyyy/README.md</text>
      <text x="1143" y="54" fill="#00ff88" fill-opacity=".35" text-anchor="end">TTY_01 :: SECURE</text>
    </g>
    <path d="M23 76H1177" stroke="#00ff88" stroke-opacity=".14"/>

    <g class="mono">
      <text x="54" y="115" fill="#6ee7b7" font-size="14" letter-spacing="2">// PROFILE.README</text>

      <g clip-path="url(#nameClip)">
        <text class="ghost-red" x="52" y="199" fill="#ff003c" font-size="74" font-weight="800" letter-spacing="-2">JOSHUA</text>
        <text class="ghost-cyan" x="52" y="199" fill="#00cfff" font-size="74" font-weight="800" letter-spacing="-2">JOSHUA</text>
        <text x="52" y="199" fill="#00ff88" font-size="74" font-weight="800" letter-spacing="-2" filter="url(#softGlow)">JOSHUA</text>
        <text x="52" y="274" fill="#c9d1d9" font-size="57" font-weight="700" letter-spacing="-1.6">NWACHINEMERE</text>
      </g>

      <text x="55" y="315" fill="#00cfff" font-size="16">AI Engineer</text>
      <text x="171" y="315" fill="#30363d">|</text>
      <text x="190" y="315" fill="#6ee7b7" font-size="16">Python</text>
      <text x="266" y="315" fill="#30363d">|</text>
      <text x="286" y="315" fill="#6ee7b7" font-size="16">Building VolyxAI</text>
      <text x="447" y="315" fill="#30363d">|</text>
      <text x="467" y="315" fill="#6ee7b7" font-size="16">0.0.0.0</text>

      <circle class="pulse" cx="61" cy="348" r="7" fill="#4ade80" filter="url(#greenGlow)"/>
      <text x="80" y="354" fill="#4ade80" font-size="14">open to AI / ML engineering roles</text>

      <rect x="52" y="384" width="625" height="142" rx="5" fill="#00ff88" fill-opacity=".025" stroke="#00ff88" stroke-opacity=".14"/>
      <text x="70" y="412" fill="#00ff88" font-size="15" font-weight="700">❯ cat about.txt</text>
      <path d="M220 408H657" stroke="#00ff88" stroke-opacity=".13"/>
      <text x="70" y="443" fill="#a5d6ff" font-size="14">I build the retrieval, routing, evaluation and reliability</text>
      <text x="70" y="468" fill="#a5d6ff" font-size="14">layers that turn model capability into useful systems.</text>
      <text x="70" y="499" fill="#00ff88" font-size="13">focus → <tspan fill="#c9d1d9">RAG · multimodal AI · async backends · evals</tspan></text>
    </g>

    <g transform="translate(723 106)" class="mono">
      <rect width="419" height="420" rx="6" fill="#05080b" stroke="#00ff88" stroke-opacity=".16"/>
      <rect width="419" height="46" rx="6" fill="#00ff88" fill-opacity=".035"/>
      <text x="20" y="29" fill="#00ff88" font-size="14">volyx@os:~$ boot --profile</text>
      <text x="396" y="29" fill="#00cfff" fill-opacity=".55" font-size="12" text-anchor="end">PID 0728</text>

      <text class="boot1" x="20" y="83" fill="#8b949e" font-size="13">[<tspan fill="#00ff88"> OK </tspan>] kernel.profile</text>
      <text class="boot2" x="20" y="116" fill="#8b949e" font-size="13">[<tspan fill="#00ff88"> OK </tspan>] rag_pipeline.py</text>
      <text class="boot3" x="20" y="149" fill="#8b949e" font-size="13">[<tspan fill="#00ff88"> OK </tspan>] multimodal_router.py</text>
      <text class="boot4" x="20" y="182" fill="#8b949e" font-size="13">[<tspan fill="#00ff88"> OK </tspan>] structured_outputs.py</text>
      <text class="boot5" x="20" y="215" fill="#8b949e" font-size="13">[<tspan fill="#00ff88"> OK </tspan>] eval_harness.py</text>
      <text class="boot6" x="20" y="248" fill="#8b949e" font-size="13">[<tspan fill="#00cfff">LIVE</tspan>] human_control.gate</text>

      <path class="route" d="M20 282H397" stroke="#00ff88" stroke-opacity=".38" stroke-width="2"/>
      <g font-size="12">
        <rect x="20" y="306" width="105" height="42" rx="4" fill="#00ff88" fill-opacity=".04" stroke="#00ff88" stroke-opacity=".18"/>
        <rect x="157" y="306" width="105" height="42" rx="4" fill="#00cfff" fill-opacity=".04" stroke="#00cfff" stroke-opacity=".24"/>
        <rect x="294" y="306" width="103" height="42" rx="4" fill="#00ff88" fill-opacity=".04" stroke="#00ff88" stroke-opacity=".18"/>
        <text x="72" y="332" text-anchor="middle" fill="#6ee7b7">CONTEXT</text>
        <text x="209" y="332" text-anchor="middle" fill="#00cfff">MODEL</text>
        <text x="345" y="332" text-anchor="middle" fill="#6ee7b7">TOOLS</text>
        <path d="M125 327H157M262 327H294" stroke="#00ff88" stroke-opacity=".45"/>
      </g>
      <text x="20" y="389" fill="#00ff88" font-size="13">volyx@os:~$ <tspan class="cursor" fill="#00ff88">█</tspan></text>
    </g>

    <g class="mono" font-size="12">
      <path d="M52 558H1142" stroke="#00ff88" stroke-opacity=".12"/>
      <text x="54" y="584" fill="#00ff88" fill-opacity=".38">// built with intent. every system a decision.</text>
      <text x="1142" y="584" fill="#00ff88" text-anchor="end">❯ explore --scroll</text>
    </g>
  </g>

  <rect class="scan" width="1200" height="644" y="-24" rx="22" fill="url(#scanlines)" pointer-events="none"/>
  <rect width="1200" height="620" rx="22" fill="url(#vignette)" pointer-events="none"/>
</svg>

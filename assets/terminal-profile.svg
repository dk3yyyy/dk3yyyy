<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Joshua Nwachinemere terminal profile</title>
  <desc id="desc">A dark terminal window with a geometric JN monogram and a small human approval workflow on the left, plus verified engineering profile fields on the right.</desc>

  <rect width="1200" height="480" rx="20" fill="#080d18"/>
  <rect x="1" y="1" width="1198" height="478" rx="19" fill="none" stroke="#29344d" stroke-width="2"/>
  <path d="M20 1h1160a19 19 0 0 1 19 19v32H1V20A19 19 0 0 1 20 1Z" fill="#11192a"/>
  <circle cx="29" cy="26" r="6" fill="#ff6b6b"/>
  <circle cx="51" cy="26" r="6" fill="#f4c95d"/>
  <circle cx="73" cy="26" r="6" fill="#62d6a7"/>
  <text x="600" y="32" text-anchor="middle" fill="#8492ad" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">joshua@github: ~/profile</text>

  <g aria-label="Geometric JN monogram">
    <path d="M82 113H248V284C248 337 218 368 166 368H132C100 368 82 351 82 322" fill="none" stroke="#68d8ee" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M291 368V113L438 368V113" fill="none" stroke="#b9a1ff" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M82 113H150" fill="none" stroke="#62d6a7" stroke-width="17"/>
    <circle cx="248" cy="284" r="5" fill="#f4c95d"/>
    <circle cx="291" cy="368" r="5" fill="#62d6a7"/>
    <circle cx="438" cy="113" r="5" fill="#68d8ee"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="82" y="91" fill="#8492ad" font-size="13" letter-spacing="2">JN / CONTROLLED SYSTEMS</text>
    <text x="82" y="402" fill="#dbe5f5" font-size="15" font-weight="700">dk3yyyy</text>
    <text x="160" y="402" fill="#8492ad" font-size="15">:: build with a human in the loop</text>
  </g>

  <g aria-label="Workflow from input through verification and approval to shipping" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <line x1="83" y1="433" x2="438" y2="433" stroke="#34415d" stroke-width="2"/>
    <circle cx="83" cy="433" r="6" fill="#080d18" stroke="#68d8ee" stroke-width="3"/>
    <circle cx="178" cy="433" r="6" fill="#080d18" stroke="#62d6a7" stroke-width="3"/>
    <circle cx="273" cy="433" r="6" fill="#080d18" stroke="#b9a1ff" stroke-width="3"/>
    <rect x="360" y="424" width="18" height="18" rx="3" fill="#172035" stroke="#f4c95d" stroke-width="2"/>
    <path d="m365 433 4 4 7-9" fill="none" stroke="#f4c95d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M438 426v14m-7-7h14" stroke="#68d8ee" stroke-width="2" stroke-linecap="round"/>
    <text x="83" y="458" text-anchor="middle" fill="#72809a" font-size="13">input</text>
    <text x="178" y="458" text-anchor="middle" fill="#72809a" font-size="13">verify</text>
    <text x="273" y="458" text-anchor="middle" fill="#72809a" font-size="13">retry</text>
    <text x="369" y="458" text-anchor="middle" fill="#72809a" font-size="13">approve</text>
    <text x="438" y="458" text-anchor="middle" fill="#72809a" font-size="13">ship</text>
  </g>

  <line x1="505" y1="83" x2="505" y2="447" stroke="#29344d" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="553" y="102" fill="#68d8ee" font-size="24" font-weight="700">joshua</text>
    <text x="642" y="102" fill="#66748e" font-size="24">@</text>
    <text x="666" y="102" fill="#62d6a7" font-size="24" font-weight="700">dk3yyyy</text>
    <text x="553" y="127" fill="#43516d" font-size="16">──────────────────────────────────────</text>

    <g font-size="17">
      <text x="553" y="169" fill="#b9a1ff" font-weight="700">role</text>
      <text x="700" y="169" fill="#dbe5f5">AI engineer</text>

      <text x="553" y="211" fill="#b9a1ff" font-weight="700">builds</text>
      <text x="700" y="211" fill="#dbe5f5">backend · ML · automation</text>

      <text x="553" y="253" fill="#b9a1ff" font-weight="700">systems</text>
      <text x="700" y="253" fill="#dbe5f5">inspect · test · hand over</text>

      <text x="553" y="295" fill="#b9a1ff" font-weight="700">controls</text>
      <text x="700" y="295" fill="#dbe5f5">approval gates · retries · idempotency</text>

      <text x="553" y="337" fill="#b9a1ff" font-weight="700">stack</text>
      <text x="700" y="337" fill="#dbe5f5">Python · TypeScript · FastAPI · n8n</text>

      <text x="553" y="379" fill="#b9a1ff" font-weight="700">ships</text>
      <text x="700" y="379" fill="#dbe5f5">Docker · GitHub Actions · Azure</text>

      <text x="553" y="421" fill="#b9a1ff" font-weight="700">status</text>
      <text x="700" y="421" fill="#dbe5f5">open to AI Engineer roles</text>
    </g>

    <text x="553" y="455" fill="#72809a" font-size="13">static profile / evidence-backed fields / no telemetry</text>
  </g>
